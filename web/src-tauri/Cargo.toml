[package]
name = "novel-hub"
version = "0.2.0"
description = "Local-first AI writing workspace"
authors = ["Novel Hub"]
edition = "2021"

[lib]
name = "novel_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
